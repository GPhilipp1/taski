server {
    listen 80;
    server_name taski.yp-philxgrab.ru www.taski.yp-philxgrab.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name taski.yp-philxgrab.ru www.taski.yp-philxgrab.ru;

    ssl_certificate /etc/letsencrypt/live/taski.yp-philxgrab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taski.yp-philxgrab.ru/privkey.pem;

    location / {
        root /staticfiles/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        root /staticfiles/;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

